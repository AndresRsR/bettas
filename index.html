<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050708">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Bettas">
  <link rel="icon" type="image/png" href="assets/betta-logo-inline.png">
  <link rel="shortcut icon" type="image/png" href="assets/betta-logo-inline.png">
  <link rel="apple-touch-icon" href="assets/betta-logo-inline.png">
  <title>Registro Bettas</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #050708;
      --panel: #0b1013;
      --panel-2: #10171b;
      --line: rgba(255, 255, 255, 0.12);
      --line-strong: rgba(255, 255, 255, 0.2);
      --text: #f4f7f8;
      --muted: #94a4aa;
      --blue: #37b9ff;
      --cyan: #76e4ff;
      --coral: #ff7768;
      --gold: #ffc45b;
      --green: #46d89a;
      --shadow: 0 20px 70px rgba(0, 0, 0, 0.38);
      --radius: 8px;
      font-family: Inter, ui-rounded, "SF Pro Display", "SF Pro Text", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--bg);
    }

    body {
      min-height: 100%;
      margin: 0;
      overflow-x: hidden;
      color: var(--text);
      background:
        radial-gradient(circle at 14% 4%, rgba(55, 185, 255, 0.18), transparent 26rem),
        radial-gradient(circle at 92% 10%, rgba(255, 119, 104, 0.14), transparent 20rem),
        linear-gradient(180deg, #020304 0%, var(--bg) 40%, #030506 100%);
      font-size: 16px;
      letter-spacing: 0;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      -webkit-tap-highlight-color: transparent;
    }

    .app {
      width: min(100%, 760px);
      min-height: 100vh;
      margin: 0 auto;
      padding: max(14px, env(safe-area-inset-top)) 14px calc(112px + env(safe-area-inset-bottom));
    }

    .shell {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(4, 7, 8, 0.82);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
    }

    .hero {
      display: grid;
      grid-template-columns: 94px 1fr;
      gap: 14px;
      align-items: center;
      padding: 18px 16px 14px;
      border-bottom: 1px solid var(--line);
      background:
        linear-gradient(135deg, rgba(55, 185, 255, 0.16), rgba(255, 119, 104, 0.07) 52%, rgba(255, 196, 91, 0.08)),
        rgba(255, 255, 255, 0.03);
    }

    .logo-wrap {
      display: grid;
      place-items: center;
      width: 94px;
      height: 94px;
      border: 1px solid rgba(118, 228, 255, 0.28);
      border-radius: 50%;
      background: #000;
      box-shadow: inset 0 0 26px rgba(55, 185, 255, 0.18);
    }

    .logo {
      width: 90px;
      height: 90px;
      object-fit: contain;
    }

    .title-block {
      min-width: 0;
    }

    .eyebrow {
      margin: 0 0 5px;
      color: var(--cyan);
      font-size: 0.78rem;
      font-weight: 800;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: 1.85rem;
      line-height: 1.05;
      letter-spacing: 0;
    }

    .date-line {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.025);
    }

    .summary-item {
      padding: 13px 10px;
      text-align: center;
      border-right: 1px solid var(--line);
    }

    .summary-item:last-child {
      border-right: 0;
    }

    .summary-label {
      display: block;
      color: var(--muted);
      font-size: 0.74rem;
      font-weight: 700;
      text-transform: uppercase;
    }

    .summary-value {
      display: block;
      margin-top: 4px;
      color: var(--text);
      font-size: 1.18rem;
      font-weight: 800;
    }

    .food-bar {
      padding: 13px 12px 14px;
      border-bottom: 1px solid var(--line);
    }

    .field-label {
      display: block;
      margin-bottom: 9px;
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 800;
      text-transform: uppercase;
    }

    .food-scroll {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 2px;
      scrollbar-width: none;
    }

    .food-scroll::-webkit-scrollbar {
      display: none;
    }

    .food-chip {
      min-height: 42px;
      flex: 0 0 auto;
      padding: 0 14px;
      border: 1px solid var(--line-strong);
      border-radius: 999px;
      color: var(--text);
      background: rgba(255, 255, 255, 0.045);
    }

    .food-chip[aria-pressed="true"] {
      border-color: rgba(118, 228, 255, 0.85);
      color: #061014;
      background: linear-gradient(135deg, var(--cyan), var(--gold));
      font-weight: 900;
    }

    .table {
      width: 100%;
    }

    .table-tools {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 11px 12px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.018);
    }

    .table-tools-title {
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 800;
      text-transform: uppercase;
    }

    .add-fish-btn {
      display: inline-grid;
      grid-template-columns: 16px auto;
      gap: 7px;
      align-items: center;
      min-height: 38px;
      color: var(--text);
      border-color: rgba(118, 228, 255, 0.34);
    }

    .add-fish-btn .icon {
      width: 16px;
      height: 16px;
    }

    .add-fish-form {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 9px;
      align-items: center;
      padding: 12px;
      border-bottom: 1px solid var(--line);
      background: rgba(55, 185, 255, 0.06);
    }

    .add-fish-form[hidden] {
      display: none;
    }

    .fish-input {
      width: 100%;
      min-height: 44px;
      padding: 0 12px;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius);
      color: var(--text);
      background: rgba(0, 0, 0, 0.22);
      outline: none;
    }

    .fish-input:focus {
      border-color: var(--cyan);
      box-shadow: 0 0 0 3px rgba(118, 228, 255, 0.13);
    }

    .form-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .form-submit {
      color: #061014;
      border-color: transparent;
      background: linear-gradient(135deg, var(--cyan), var(--gold));
      font-weight: 900;
    }

    .table-head,
    .fish-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 150px;
      align-items: center;
    }

    .table-head {
      min-height: 46px;
      color: var(--muted);
      font-size: 0.83rem;
      font-weight: 800;
      text-transform: uppercase;
      background: rgba(255, 255, 255, 0.025);
      border-bottom: 1px solid var(--line);
    }

    .table-head span,
    .fish-name,
    .ration-control {
      padding: 0 12px;
    }

    .table-head span:first-child,
    .fish-name {
      border-right: 1px solid var(--line);
    }

    .fish-row {
      min-height: 62px;
      border-bottom: 1px solid var(--line);
    }

    .fish-row:last-child {
      border-bottom: 0;
    }

    .fish-name {
      display: flex;
      align-items: center;
      min-width: 0;
      height: 100%;
      font-size: 1.18rem;
      font-weight: 650;
      overflow-wrap: anywhere;
    }

    .ration-control {
      display: grid;
      grid-template-columns: 42px minmax(36px, 1fr) 42px;
      gap: 8px;
      align-items: center;
    }

    .stepper-btn,
    .icon-btn {
      display: inline-grid;
      place-items: center;
      min-width: 44px;
      min-height: 44px;
      border: 1px solid var(--line-strong);
      border-radius: 999px;
      color: var(--text);
      background: rgba(255, 255, 255, 0.055);
      cursor: pointer;
      transition: transform 130ms ease, border-color 130ms ease, background 130ms ease;
    }

    .stepper-btn {
      font-size: 1.35rem;
      font-weight: 900;
    }

    .stepper-btn:active,
    .icon-btn:active,
    .primary-action:active {
      transform: scale(0.95);
    }

    .stepper-btn:disabled {
      opacity: 0.36;
      cursor: default;
    }

    .amount {
      display: grid;
      place-items: center;
      min-width: 36px;
      height: 44px;
      border: 1px solid rgba(118, 228, 255, 0.2);
      border-radius: var(--radius);
      color: #ffffff;
      background: rgba(55, 185, 255, 0.12);
      font-size: 1.28rem;
      font-weight: 900;
    }

    .history {
      padding: 14px 12px 16px;
      border-top: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.018);
    }

    .history-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }

    .history-title h2 {
      margin: 0;
      font-size: 0.92rem;
      text-transform: uppercase;
    }

    .tiny-btn {
      min-height: 36px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.035);
    }

    .history-list {
      display: grid;
      gap: 8px;
    }

    .history-empty {
      margin: 0;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .history-item {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: center;
      padding: 10px 0;
      border-top: 1px solid var(--line);
    }

    .history-item:first-child {
      border-top: 0;
    }

    .history-main {
      min-width: 0;
    }

    .history-food {
      display: block;
      font-weight: 850;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .history-date {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 0.86rem;
    }

    .history-total {
      display: inline-grid;
      place-items: center;
      min-width: 44px;
      height: 36px;
      border-radius: 999px;
      color: #061014;
      background: var(--green);
      font-weight: 900;
    }

    .bottom-bar {
      position: fixed;
      right: 0;
      bottom: 0;
      left: 0;
      z-index: 20;
      padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
      background: linear-gradient(180deg, rgba(5, 7, 8, 0), rgba(5, 7, 8, 0.82) 18%, rgba(5, 7, 8, 0.98));
      pointer-events: none;
    }

    .bottom-inner {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 9px;
      align-items: center;
      width: min(100%, 760px);
      margin: 0 auto;
      padding: 10px;
      border: 1px solid var(--line-strong);
      border-radius: 22px;
      background: rgba(13, 19, 22, 0.93);
      box-shadow: 0 16px 44px rgba(0, 0, 0, 0.44);
      backdrop-filter: blur(20px);
      pointer-events: auto;
    }

    .bottom-total {
      min-width: 0;
      padding-left: 3px;
    }

    .bottom-total span {
      display: block;
      color: var(--muted);
      font-size: 0.74rem;
      font-weight: 800;
      text-transform: uppercase;
    }

    .bottom-total strong {
      display: block;
      margin-top: 2px;
      font-size: 1.1rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .primary-action {
      display: inline-grid;
      grid-template-columns: 18px auto;
      gap: 8px;
      align-items: center;
      min-height: 46px;
      padding: 0 14px;
      border: 0;
      border-radius: 999px;
      color: #061014;
      background: linear-gradient(135deg, var(--cyan), var(--gold));
      font-weight: 950;
      cursor: pointer;
      transition: transform 130ms ease, filter 130ms ease;
    }

    .primary-action.saved {
      filter: saturate(1.2) brightness(1.07);
    }

    .icon {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.25;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 420px) {
      .app {
        padding-right: 10px;
        padding-left: 10px;
      }

      .shell {
        border-radius: 14px;
      }

      .hero {
        grid-template-columns: 76px 1fr;
        gap: 11px;
        padding: 14px 12px 12px;
      }

      .logo-wrap {
        width: 76px;
        height: 76px;
      }

      .logo {
        width: 73px;
        height: 73px;
      }

      h1 {
        font-size: 1.45rem;
      }

      .date-line {
        font-size: 0.84rem;
      }

      .table-head,
      .fish-row {
        grid-template-columns: minmax(0, 1fr) 148px;
      }

      .add-fish-form {
        grid-template-columns: 1fr;
      }

      .form-actions {
        justify-content: flex-end;
      }

      .fish-name {
        font-size: 1.08rem;
      }

      .ration-control {
        grid-template-columns: 38px minmax(34px, 1fr) 38px;
        gap: 6px;
        padding-right: 9px;
        padding-left: 9px;
      }

      .stepper-btn,
      .icon-btn {
        min-width: 40px;
        min-height: 40px;
      }

      .amount {
        height: 40px;
        font-size: 1.15rem;
      }

      .primary-action {
        min-height: 44px;
        padding-right: 12px;
        padding-left: 12px;
      }
    }

    @media (min-width: 780px) {
      .app {
        padding-top: 34px;
      }

      .shell {
        border-radius: 22px;
      }

      .fish-row {
        min-height: 58px;
      }
    }
  </style>
</head>

    const STORAGE_KEY = "betta-feeding-state-v1";
    const HISTORY_KEY = "betta-feeding-history-v1";
    const FOOD_KEY = "betta-feeding-food-v1";

    const defaultFish = [
      { name: "Sky", amount: 2 },
      { name: "Foxy", amount: 2 },
      { name: "Daenerys", amount: 2 },
      { name: "Venus", amount: 3 },
      { name: "Silver", amount: 2 },
      { name: "Metal", amount: 3 },
      { name: "Tyrande", amount: 3 },
      { name: "Yamato", amount: 2 },
      { name: "Samurai", amount: 3 },
      { name: "Galaxy", amount: 3 },
      { name: "Kalipso", amount: 3 },
      { name: "Dante", amount: 0 }
    ];

    const foods = ["Pellets", "Gambas", "Larva", "Higado", "Ayuno"];
    const maxAmount = 12;
    const memoryStorage = {};

    const elements = {
      todayText: document.querySelector("#todayText"),
      fishRows: document.querySelector("#fishRows"),
      fishCount: document.querySelector("#fishCount"),
      summaryTotal: document.querySelector("#summaryTotal"),
      summaryFood: document.querySelector("#summaryFood"),
      bottomTotal: document.querySelector("#bottomTotal"),
      foodChoices: document.querySelector("#foodChoices"),
      historyList: document.querySelector("#historyList"),
      resetBtn: document.querySelector("#resetBtn"),
      saveBtn: document.querySelector("#saveBtn"),
      clearHistory: document.querySelector("#clearHistory"),
      openAddFish: document.querySelector("#openAddFish"),
      addFishForm: document.querySelector("#addFishForm"),
      fishNameInput: document.querySelector("#fishNameInput"),
      cancelAddFish: document.querySelector("#cancelAddFish")
    };

    let state = loadState();
    let selectedFood = readStorage(FOOD_KEY) || foods[0];
    let history = loadHistory();

    if (!foods.includes(selectedFood)) {
      selectedFood = foods[0];
    }

    function readStorage(key) {
      try {
        return window.localStorage.getItem(key);
      } catch {
        return Object.prototype.hasOwnProperty.call(memoryStorage, key) ? memoryStorage[key] : null;
      }
    }

    function writeStorage(key, value) {
      memoryStorage[key] = value;
      try {
        window.localStorage.setItem(key, value);
      } catch {
        // Some iPhone file previews block localStorage, but the app should keep running.
      }
    }

    function removeStorage(key) {
      delete memoryStorage[key];
      try {
        window.localStorage.removeItem(key);
      } catch {
        // See writeStorage.
      }
    }

    function loadState() {
      try {
        const saved = JSON.parse(readStorage(STORAGE_KEY));
        if (!Array.isArray(saved)) return cloneDefaults();
        const result = defaultFish.map((fish) => {
          const existing = saved.find((item) => item && item.name === fish.name);
          const amount = Number(existing && existing.amount);
          return {
            name: fish.name,
            amount: Number.isFinite(amount) ? clampAmount(amount) : fish.amount
          };
        });
        const knownNames = new Set(result.map((fish) => fish.name.toLowerCase()));

        saved.forEach((item) => {
          const fish = normalizeFish(item, 0);
          if (fish && !knownNames.has(fish.name.toLowerCase())) {
            knownNames.add(fish.name.toLowerCase());
            result.push(fish);
          }
        });

        return result;
      } catch {
        return cloneDefaults();
      }
    }

    function loadHistory() {
      try {
        const saved = JSON.parse(readStorage(HISTORY_KEY));
        return Array.isArray(saved) ? saved.slice(0, 8) : [];
      } catch {
        return [];
      }
    }

    function normalizeFish(item, fallbackAmount) {
      const name = String(item && item.name ? item.name : "").trim().replace(/\s+/g, " ");
      const amount = Number(item && item.amount);
      if (!name) return null;
      return {
        name,
        amount: Number.isFinite(amount) ? clampAmount(amount) : fallbackAmount
      };
    }

    function cloneDefaults() {
      return defaultFish.map((fish) => ({ ...fish }));
    }

    function clampAmount(value) {
      return Math.min(maxAmount, Math.max(0, Math.round(value)));
    }

    function saveState() {
      writeStorage(STORAGE_KEY, JSON.stringify(state));
      writeStorage(FOOD_KEY, selectedFood);
    }

    function totalRations() {
      return state.reduce((total, fish) => total + fish.amount, 0);
    }

    function formatDate(date) {
      return new Intl.DateTimeFormat("es", {
        weekday: "long",
        day: "numeric",
        month: "long",
        hour: "numeric",
        minute: "2-digit"
      }).format(date);
    }

    function renderHeader() {
      elements.todayText.textContent = formatDate(new Date());
      elements.fishCount.textContent = String(state.length);
    }

    function renderFoodChoices() {
      elements.foodChoices.innerHTML = "";
      foods.forEach((food) => {
        const button = document.createElement("button");
        button.className = "food-chip";
        button.type = "button";
        button.textContent = food;
        button.setAttribute("aria-pressed", String(food === selectedFood));
        button.addEventListener("click", () => {
          selectedFood = food;
          saveState();
          render();
        });
        elements.foodChoices.appendChild(button);
      });
    }

    function renderRows() {
      elements.fishRows.innerHTML = "";
      state.forEach((fish, index) => {
        const row = document.createElement("div");
        row.className = "fish-row";

        const name = document.createElement("div");
        name.className = "fish-name";
        name.textContent = fish.name;

        const control = document.createElement("div");
        control.className = "ration-control";

        const minus = document.createElement("button");
        minus.className = "stepper-btn";
        minus.type = "button";
        minus.textContent = "-";
        minus.disabled = fish.amount === 0;
        minus.setAttribute("aria-label", `Bajar racion de ${fish.name}`);
        minus.addEventListener("click", () => updateAmount(index, -1));

        const amount = document.createElement("span");
        amount.className = "amount";
        amount.textContent = String(fish.amount);
        amount.setAttribute("aria-label", `${fish.amount} raciones`);

        const plus = document.createElement("button");
        plus.className = "stepper-btn";
        plus.type = "button";
        plus.textContent = "+";
        plus.disabled = fish.amount === maxAmount;
        plus.setAttribute("aria-label", `Subir racion de ${fish.name}`);
        plus.addEventListener("click", () => updateAmount(index, 1));

        control.append(minus, amount, plus);
        row.append(name, control);
        elements.fishRows.appendChild(row);
      });
    }

    function renderSummary() {
      const total = totalRations();
      elements.summaryTotal.textContent = String(total);
      elements.summaryFood.textContent = selectedFood;
      elements.bottomTotal.textContent = `${total} ${total === 1 ? "racion" : "raciones"}`;
    }

    function renderHistory() {
      elements.historyList.innerHTML = "";
      if (history.length === 0) {
        const empty = document.createElement("p");
        empty.className = "history-empty";
        empty.textContent = "Todavia no hay comidas guardadas.";
        elements.historyList.appendChild(empty);
        return;
      }

      history.forEach((item) => {
        const entry = document.createElement("article");
        entry.className = "history-item";

        const main = document.createElement("div");
        main.className = "history-main";

        const food = document.createElement("span");
        food.className = "history-food";
        food.textContent = item.food;

        const date = document.createElement("span");
        date.className = "history-date";
        date.textContent = item.dateText;

        const total = document.createElement("span");
        total.className = "history-total";
        total.textContent = item.total;
        total.setAttribute("aria-label", `${item.total} raciones`);

        main.append(food, date);
        entry.append(main, total);
        elements.historyList.appendChild(entry);
      });
    }

    function updateAmount(index, change) {
      state[index].amount = clampAmount(state[index].amount + change);
      saveState();
      renderRows();
      renderSummary();
    }

    function defaultAmountFor(name) {
      const fish = defaultFish.find((item) => item.name === name);
      return fish ? fish.amount : 0;
    }

    function resetRations() {
      state = state.map((fish) => ({
        name: fish.name,
        amount: defaultAmountFor(fish.name)
      }));
      saveState();
      render();
    }

    function openAddFishForm() {
      elements.addFishForm.hidden = false;
      elements.fishNameInput.value = "";
      window.setTimeout(() => elements.fishNameInput.focus(), 0);
    }

    function closeAddFishForm() {
      elements.addFishForm.hidden = true;
      elements.fishNameInput.value = "";
      elements.fishNameInput.setCustomValidity("");
    }

    function addFish(event) {
      event.preventDefault();
      const fish = normalizeFish({ name: elements.fishNameInput.value, amount: 0 }, 0);
      if (!fish) return;

      const exists = state.some((item) => item.name.toLowerCase() === fish.name.toLowerCase());
      if (exists) {
        elements.fishNameInput.setCustomValidity("Ese pez ya esta en la lista.");
        elements.fishNameInput.reportValidity();
        window.setTimeout(() => elements.fishNameInput.setCustomValidity(""), 400);
        return;
      }

      state.push(fish);
      saveState();
      closeAddFishForm();
      render();
    }

    function saveMeal() {
      const now = new Date();
      history = [
        {
          food: selectedFood,
          total: totalRations(),
          dateText: formatDate(now),
          items: state.map((fish) => ({ name: fish.name, amount: fish.amount }))
        },
        ...history
      ].slice(0, 8);

      writeStorage(HISTORY_KEY, JSON.stringify(history));
      elements.saveBtn.classList.add("saved");
      elements.saveBtn.querySelector("span").textContent = "Guardado";
      window.setTimeout(() => {
        elements.saveBtn.classList.remove("saved");
        elements.saveBtn.querySelector("span").textContent = "Guardar";
      }, 1200);
      renderHistory();
    }

    function clearHistory() {
      history = [];
      removeStorage(HISTORY_KEY);
      renderHistory();
    }

    function render() {
      renderHeader();
      renderFoodChoices();
      renderRows();
      renderSummary();
      renderHistory();
    }

    elements.resetBtn.addEventListener("click", resetRations);
    elements.saveBtn.addEventListener("click", saveMeal);
    elements.clearHistory.addEventListener("click", clearHistory);
    elements.openAddFish.addEventListener("click", openAddFishForm);
    elements.cancelAddFish.addEventListener("click", closeAddFishForm);
    elements.addFishForm.addEventListener("submit", addFish);

    render();
  </script>
</body>
</html>
